# Runs on every push and pull request: lint, tests, and a full training run.
# A green badge on GitHub tells a reviewer the code works without them running it.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[api,dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest -q
      - name: Full pipeline
        run: |
          python -m wdbc.eda
          python -m wdbc.train

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t wdbc-api .
      - name: Smoke-test the container
        run: |
          docker run -d -p 8000:8000 --name api wdbc-api
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d @examples/sample_request.json
